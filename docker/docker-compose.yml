services:
  minio:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    command: server /data --address ":9100" --console-address ":9101"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?請在 .env 設定 MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?請在 .env 設定 MINIO_ROOT_PASSWORD}"
      MINIO_BROWSER_REDIRECT_URL: "https://localhost:9101"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - minio
    ports:
      - "127.0.0.1:9100:9100"
      - "127.0.0.1:9101:9101"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  minio-data: